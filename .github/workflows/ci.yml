name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  console-ui:
    name: console page component tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - run: npm run build:ui

  alerting:
    name: promtool and amtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-alerting.sh

  integration:
    name: integration tests against the compose stack
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: npm run test:integration
      - name: browser test (console page, Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: browser test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      - run: docker compose down -v
        if: always()
