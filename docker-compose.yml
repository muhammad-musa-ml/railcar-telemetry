name: railcar

x-app: &app
  build: .
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 10

# Tracing settings shared by the three pipeline services and the console.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_SAMPLER: parentbased_always_on

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: railcar
      POSTGRES_PASSWORD: railcar
      POSTGRES_DB: railcar
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    # Only toxiproxy talks to Postgres, by fixed address (see networks below).
    networks:
      db:
        ipv4_address: 10.203.17.2
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "railcar", "-d", "railcar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Every Postgres client goes through toxiproxy, so a game day can add
  # latency or cut the connection without touching Postgres itself.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./docker/toxiproxy.json:/config/toxiproxy.json:ro
    networks:
      - default
      - db
    ports:
      - "8474:8474"
    depends_on:
      postgres:
        condition: service_healthy

  # Applies db/migrations (the console's audit table) on every start, then
  # exits. The console waits for it to finish.
  db-migrate:
    image: postgres:16-alpine
    command: ["sh", "/migrate.sh"]
    environment:
      PGHOST: toxiproxy
      PGPORT: "15432"
      PGUSER: railcar
      PGPASSWORD: railcar
      PGDATABASE: railcar
      # Local development only, like the railcar password above.
      CONSOLE_DB_PASSWORD: console-local-only
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  ingest:
    <<: *app
    command: ["node", "--require", "./dist/shared/tracing.js", "dist/ingest/main.js"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: ingest
      REDIS_URL: redis://redis:6379
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  tracker:
    <<: *app
    command: ["node", "--require", "./dist/shared/tracing.js", "dist/tracker/main.js"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: tracker
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://railcar:railcar@toxiproxy:15432/railcar
      TRACKER_CONSUMER: tracker-1
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started

  query:
    <<: *app
    command: ["node", "--require", "./dist/shared/tracing.js", "dist/query/main.js"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: query
      DATABASE_URL: postgres://railcar:railcar@toxiproxy:15432/railcar
    ports:
      - "8083:8080"
    depends_on:
      toxiproxy:
        condition: service_started

  # Stands in for the on-call paging service. Alertmanager posts to it.
  pager:
    <<: *app
    command: ["node", "dist/pager/main.js"]
    environment:
      PAGER_DATA_DIR: /data
    volumes:
      - pager-data:/data
    ports:
      - "8084:8080"

  # The operations console (docs/console.md): one screen over Prometheus,
  # Alertmanager, the pager, the dead-letter stream and the query service,
  # and the operator actions the runbooks need. Every action needs a token
  # from CONSOLE_OPERATOR_TOKENS and is recorded in console_audit.
  console:
    <<: *app
    command: ["node", "--require", "./dist/shared/tracing.js", "dist/console/main.js"]
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: console
      REDIS_URL: redis://redis:6379
      # The console's own role, which may only insert audit rows.
      DATABASE_URL: postgres://railcar_console:console-local-only@toxiproxy:15432/railcar
      PROMETHEUS_URL: http://prometheus:9090
      ALERTMANAGER_URL: http://alertmanager:9093
      PAGER_URL: http://pager:8080
      QUERY_URL: http://query:8080
      # name:token pairs. The default is a placeholder for this local stack
      # only; set your own in the environment (see README.md).
      CONSOLE_OPERATOR_TOKENS: ${CONSOLE_OPERATOR_TOKENS:-operator:local-only-not-a-secret}
    ports:
      - "8085:8080"
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  reader-sim:
    <<: *app
    command: ["node", "dist/sim/main.js"]
    environment:
      INGEST_URL: http://ingest:8080
      QUERY_URL: http://query:8080
      EVENTS_PER_SECOND: "25"
      QUERIES_PER_SECOND: "5"
    depends_on:
      ingest:
        condition: service_healthy
      query:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
    depends_on:
      - pager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dashboards and data sources come from files in the repo. Anonymous users
  # can view; nothing here is meant to be exposed beyond localhost.
  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/railcar-pipeline.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default: {}
  # Postgres has its own internal network and a fixed address, and toxiproxy
  # dials that address. With the service name instead, a stopped Postgres
  # made the name fall through to the host's DNS, which answered with a
  # machine outside this stack (docs/incidents/003-postgres-stopped.md).
  db:
    internal: true
    ipam:
      config:
        - subnet: 10.203.17.0/29

volumes:
  redis-data:
  postgres-data:
  pager-data:
  prometheus-data:
